name: build vmtool

on:
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: "${{ matrix.java == '16' && '17' || matrix.java }}"
        distribution: "temurin"
    - name: Build with Maven
      run: ./mvnw -V -ntp package -DskipTests
    - uses: actions/upload-artifact@v4
      with:
        name: lib-linux-x64
        path: arthas-vmtool/target/libArthasJniLibrary-x64.so
    strategy:
      matrix:
        java:
        - 17
        - 21
        - 25
      fail-fast: false
  build-mac:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: "${{ matrix.java }}"
        distribution: "temurin"
    - name: Build with Maven
      run: ./mvnw -V -ntp package -DskipTests
    - uses: actions/upload-artifact@v4
      with:
        name: lib-mac
        path: arthas-vmtool/target/libArthas*
    strategy:
      matrix:
        java:
        - 17
        - 21
        - 25
      fail-fast: false
  build-windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: "${{ matrix.java }}"
        distribution: "temurin"
    - name: Build with Maven
      run: ./mvnw -V -ntp package -DskipTests
    - uses: actions/upload-artifact@v4
      with:
        name: lib-windows
        path: arthas-vmtool/target/*.dll

    strategy:
      matrix:
        java:
        - 17
        - 21
        - 25
      fail-fast: false
  build-linux-aarch64:
    # The host should always be Linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
    - uses: uraimo/run-on-arch-action@v2
      name: Run commands
      id: runcmd
      with:
        arch: aarch64
        distro: ubuntu20.04

          # Not required, but speeds up builds by storing container images in
          # a GitHub package registry.
        githubToken: ${{ github.token }}

        run: |
          apt update && apt install openjdk-11-jdk g++ -y
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-arm64
          ./mvnw -V -ntp package -DskipTests -pl common,arthas-vmtool
          cp arthas-vmtool/target/libArthas* lib/
    - uses: actions/upload-artifact@v4
      with:
        name: lib-linux-aarch64
        path: arthas-vmtool/target/libArthas*

  commit_vmtool_files:
    runs-on: ubuntu-latest
    needs: [build-linux-x64, build-linux-aarch64, build-mac, build-windows]
    steps:
    - name: Checkout Upstream Repo
      uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        path: tmplib
    - name: Display structure of downloaded files
      run: ls -R
      working-directory: tmplib
    - name: Commit files
      run: |
        mkdir -p lib
        cp tmplib/*/* lib/
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add lib/
        git commit -m "update arthas vmtool lib"
    - name: Push changes
      uses: ad-m/github-push-action@v0.8.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
env:
  _JAVA_OPTIONS: --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/java.text=ALL-UNNAMED --add-opens java.base/java.math=ALL-UNNAMED --add-opens java.base/java.time=ALL-UNNAMED --add-opens java.xml/jdk.xml.internal=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
